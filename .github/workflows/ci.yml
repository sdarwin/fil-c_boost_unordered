name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - feature/**
      - fix/**

env:
  B2_CI_VERSION: 1

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset: clang
            compiler: fil++
            cflags: --target=x86_64-unknown-linux-gnu
            cxxflags: "--target=x86_64-unknown-linux-gnu -DBOOST_ALL_NO_EMBEDDED_GDB_SCRIPTS"
            linkflags: --target=x86_64-unknown-linux-gnu
            cxxstd: "20"
            container: ubuntu:24.04
            os: ubuntu-latest
            install: clang wget

    runs-on: ${{matrix.os}}
    container:
      image: ${{matrix.container}}
      volumes:
        - /node20217:/node20217:rw,rshared
        - ${{ startsWith(matrix.container, 'ubuntu:1') && '/node20217:/__e/node20:ro,rshared' || ' ' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Setup container environment
        if: matrix.container
        run: |
          apt-get update
          apt-get -y install sudo python3 git g++ curl xz-utils
          if [[ "${{matrix.container}}" == "ubuntu:1"* ]]; then
            # Node 20 doesn't work with Ubuntu 16/18  glibc: https://github.com/actions/checkout/issues/1590
            curl -sL https://archives.boost.io/misc/node/node-v20.9.0-linux-x64-glibc-217.tar.xz | tar -xJ --strip-components 1 -C /node20217
          fi

      - uses: actions/checkout@v4

      - name: Install packages
        if: matrix.install
        run: |
          sudo apt-get update
          sudo apt-get -y install ${{matrix.install}}
          
      - name: Install Fil-C
        if: startsWith(matrix.compiler, 'fil++')
        run: |
          set -xe
          mkdir -p /opt/downloads
          cd /opt/downloads
          fil_c_version="0.674"
          wget "https://github.com/pizlonator/fil-c/releases/download/v${fil_c_version}/optfil-${fil_c_version}-linux-x86_64.tar.xz"
          tar -xvJf "optfil-${fil_c_version}-linux-x86_64.tar.xz"
          cd "optfil-${fil_c_version}-linux-x86_64"
          echo -e "YES\nYES" | ./setup.sh
          echo "/opt/fil/bin" >> $GITHUB_PATH

      - name: Setup Boost
        run: |
          echo GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          # LIBRARY=${GITHUB_REPOSITORY#*/}
          LIBRARY=unordered
          echo LIBRARY: $LIBRARY
          echo "LIBRARY=$LIBRARY" >> $GITHUB_ENV
          echo GITHUB_BASE_REF: $GITHUB_BASE_REF
          echo GITHUB_REF: $GITHUB_REF
          REF=${GITHUB_BASE_REF:-$GITHUB_REF}
          REF=${REF#refs/heads/}
          echo REF: $REF
          BOOST_BRANCH=develop && [ "$REF" == "master" ] && BOOST_BRANCH=master || true
          echo BOOST_BRANCH: $BOOST_BRANCH
          cd ..
          git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/boost.git boost-root
          cd boost-root
          # cp -r $GITHUB_WORKSPACE/* libs/$LIBRARY
          git submodule update --init libs/$LIBRARY
          git submodule update --init tools/boostdep
          python3 tools/boostdep/depinst/depinst.py -I example --git_args "--jobs 3" $LIBRARY
          ./bootstrap.sh
          ./b2 -d0 headers

      - name: Create user-config.jam
        if: matrix.compiler
        run: |
          echo "using ${{matrix.toolset}} : : ${{matrix.compiler}} ;" > ~/user-config.jam

      - name: Run tests
        run: |
          set -xe
          cd ../boost-root
          export ADDRMD=${{matrix.address-model}}
          export CFLAGS="${{matrix.cflags}}"
          export CXXFLAGS="${{matrix.cxxflags}}"
          export LINKFLAGS="${{matrix.linkflags}}"
          ./b2 -d2 -j3 libs/$LIBRARY/test toolset=${{matrix.toolset}} cxxstd=${{matrix.cxxstd}} ${ADDRMD:+address-model=$ADDRMD} ${CFLAGS:+cflags="$CFLAGS"} ${CXXFLAGS:+cxxflags="$CXXFLAGS"} ${LINKFLAGS:+linkflags="$LINKFLAGS"} variant=debug,release


